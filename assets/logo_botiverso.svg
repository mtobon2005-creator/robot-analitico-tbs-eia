  <text x="330" y="151" fill="#102A43" font-family="Aptos, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="-2">BOTI<tspan fill="#14A99E">VERSO</tspan></text>
  <text x="336" y="204" fill="#456078" font-family="Aptos, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">INVERSIONES CON CRITERIO</text>
  <text x="336" y="248" fill="#17A698" font-family="Aptos, Arial, sans-serif" font-size="20">Explora. Compara. Decide.</text>

  <defs>
    <linearGradient id="planet" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#13A89E"/><stop offset="1" stop-color="#63E0C2"/></linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#68E0C4"/><stop offset="1" stop-color="#16A89D"/></linearGradient>
  </defs>
  <g transform="translate(48 28)">
    <circle cx="132" cy="132" r="91" fill="#102A43"/>
    <circle cx="132" cy="132" r="69" fill="url(#planet)"/>
    <path d="M77 151c25-18 45-19 62-4 16 14 34 13 49-4v32c-17 19-37 19-54 5-17-14-36-14-57 2z" fill="#102A43" opacity=".9"/>
    <path d="M73 150c22-17 44-21 64-5 19 15 37 13 57-5" fill="none" stroke="#F4FCFA" stroke-width="8" stroke-linecap="round"/>

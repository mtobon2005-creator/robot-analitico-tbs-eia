    <path d="m148 82 15 1-1 15" fill="none" stroke="#102A43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="132" cy="132" rx="116" ry="48" transform="rotate(-27 132 132)" fill="none" stroke="url(#orbit)" stroke-width="5"/>
    <circle cx="39" cy="184" r="8" fill="#F5B84B"/>
    <circle cx="220" cy="78" r="6" fill="#F5B84B"/>
